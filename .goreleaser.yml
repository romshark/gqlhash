# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - id: gqlhash
    main: ./cmd/gqlhash
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

  # A binary of its own: most of its size is the HTTP server,
  # the metrics client and the schema validator that gqlhash doesn't link.
  - id: gqlhash-proxy
    main: ./cmd/gqlhash-proxy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

  # The same proxy served with fasthttp instead of net/http. A binary of its own
  # rather than a flag, so the default proxy links no HTTP implementation it
  # doesn't serve with: fasthttp and the compression libraries it pulls in are
  # 2.8 MB that only this one carries. See GQLHASH_PROXY_FHTTP.md.
  - id: gqlhash-proxy-fhttp
    main: ./cmd/gqlhash-proxy-fhttp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

# One archive per command, so installing the hashing command doesn't drag in the
# proxy: the two differ by 8 MB.
archives:
  - id: gqlhash
    ids: [gqlhash]
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      gqlhash_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: gqlhash-proxy
    ids: [gqlhash-proxy]
    formats: [tar.gz]
    name_template: >-
      gqlhash-proxy_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: gqlhash-proxy-fhttp
    ids: [gqlhash-proxy-fhttp]
    formats: [tar.gz]
    name_template: >-
      gqlhash-proxy-fhttp_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Homebrew formulas, one per command, published to the tap on release. It needs a
# token with write access to that repository, as HOMEBREW_TAP_GITHUB_TOKEN.
homebrew_casks:
  - name: gqlhash
    ids: [gqlhash]
    homepage: https://github.com/romshark/gqlhash
    description: Hashes GraphQL executable documents, ignoring formatting
    license: MIT
    repository:
      owner: romshark
      name: tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

  - name: gqlhash-proxy
    ids: [gqlhash-proxy]
    homepage: https://github.com/romshark/gqlhash
    description: Serves an allowlist of GraphQL documents in front of an API
    license: MIT
    repository:
      owner: romshark
      name: tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

  - name: gqlhash-proxy-fhttp
    ids: [gqlhash-proxy-fhttp]
    homepage: https://github.com/romshark/gqlhash
    description: gqlhash-proxy served with fasthttp instead of net/http
    license: MIT
    repository:
      owner: romshark
      name: tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
