# A GraphQL API with gqlhash-proxy in front of it. See README.md next to this file.
services:
  api:
    build:
      context: ./api
    # The API is published so a request can be compared against one that goes
    # through the proxy. A deployment would keep it unreachable.
    ports:
      - "4000:4000"
    command: ["-listen", ":4000"]

  proxy:
    build:
      context: ..
      dockerfile: playground/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:8080"
      # The control port. A deployment keeps this one unreachable.
      - "9090:9090"
    volumes:
      # The allowlist is mounted, so a file written here is one reload away.
      - ./queries:/queries:ro
    command:
      - "-server.listen=:8080"
      - "-upstream.url=http://api:4000/graphql"
      - "-allowlist=/queries"
      - "-control.listen=:9090"
      - "-log.json=false"
      - "-log.level=debug"
