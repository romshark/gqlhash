name: goreleaser

on:
  push:
    # Run only on tags
    tags:
      - "*"

# Read by default. The scan below needs nothing more, and the release job
# widens this for itself.
permissions:
  contents: read

jobs:
  # The scan a release has to pass. The daily run in govulncheck.yml catches an
  # advisory that lands without a commit; this catches the tag being released,
  # which nothing else did — a release could go out between two daily runs.
  govulncheck:
    uses: ./.github/workflows/govulncheck.yml

  goreleaser:
    needs: govulncheck
    runs-on: ubuntu-latest
    permissions:
      # Cuts the release.
      contents: write
      # Pushes the proxy image to ghcr.io. The image.source label in
      # Dockerfile.goreleaser links that package to this repository, which is
      # what this token has write access to.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      # The arm64 image is built on an amd64 runner, which the default builder
      # can't do. No QEMU beside it: the image runs no commands during its build,
      # it only copies a binary in. There is nothing to emulate.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The casks are pushed to romshark/homebrew-tools,
          # another repository, which the job's own GITHUB_TOKEN cannot write to.
          # A PAT with contents:write on that repository,
          # as a repository secret of this one.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
