name: goreleaser

on:
  push:
    # Run only on tags
    tags:
      - "*"

permissions:
  contents: write

jobs:
  # The scan a release has to pass. The daily run in govulncheck.yml catches an
  # advisory that lands without a commit; this catches the tag being released,
  # which nothing else did — a release could go out between two daily runs.
  govulncheck:
    uses: ./.github/workflows/govulncheck.yml

  goreleaser:
    needs: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The casks are pushed to romshark/homebrew-tools,
          # another repository, which the job's own GITHUB_TOKEN cannot write to.
          # A PAT with contents:write on that repository,
          # as a repository secret of this one.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
