on: [push, pull_request]
name: CI
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go 1.26.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          check-latest: true
      - name: Checkout repository
        uses: actions/checkout@v7
      
      # Build every executable. gqlhash-proxy-fhttp is no longer a release artifact,
      # but the acceptance suite compiles it, so a break there
      # surfaces as a confusing test failure unless it's built here.
      - name: Build
        run: |
          go build -o ./bin/gqlhash ./cmd/gqlhash
          go build -o ./bin/gqlhash-proxy ./cmd/gqlhash-proxy
          go build -o ./bin/gqlhash-proxy-fhttp ./cmd/gqlhash-proxy-fhttp

      # Test.
      - name: Test and calculate coverage
        run: go test -v -covermode=count -coverprofile=coverage.out ./...
      - name: Convert coverage.out to coverage.lcov
        uses: jandelgado/gcov2lcov-action@v1
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: coverage.lcov
      # The race detector, on the packages whose tests reach the concurrent
      # code in process. The acceptance suite is left out: its servers are
      # separate processes built without -race, so the run would check only
      # the harness. See the race target in the Makefile.
      - name: Test with the race detector
        run: go test -race -count=1 $(go list ./... | grep -v /internal/acceptance)

      - name: Run go vet
        run: go vet ./...
