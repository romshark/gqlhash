name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "parser/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the deployment to replace the currently published site.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a newer push cancel a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history, tags included. The hasher is built from the last
          # release below, which a shallow clone cannot find.
          fetch-depth: 0

      - name: Install Go 1.26.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Formatting, lint rules and import order, none of them auto-fixed here.
      - name: Lint
        run: pnpm exec biome ci .

      # The page reports the version of the hasher it runs, and that has to be a
      # version anyone can install. main is usually some commits past the last
      # release, so the hasher is built from the release itself. The page around
      # it is main's.
      - name: Build the hasher from the latest release
        working-directory: .
        run: |
          tag="$(git describe --tags --abbrev=0)"
          echo "hasher: $tag"
          # A clone, not a worktree. The toolchain stamps the version it finds
          # in the repository, and a worktree has none of its own.
          git clone --quiet --branch "$tag" . ../release

          # The page calls into this binary through web/wasm. If that moved
          # since the release, the page is calling something the release does
          # not have, and the answer is a release, not a newer binary.
          if ! diff -r ../release/web/wasm web/wasm; then
            echo "web/wasm has moved since $tag, cut a release" >&2
            exit 1
          fi

          (cd ../release/web && ./scripts/build-wasm.sh)
          mkdir -p web/src/wasm web/src/vendor
          cp ../release/web/src/wasm/gqlhash.wasm web/src/wasm/
          cp ../release/web/src/vendor/wasm_exec.js web/src/vendor/

      # Runs tsc and vite. The hasher is already in place.
      - name: Build
        run: pnpm run build:site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
