name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "parser/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the deployment to replace the currently published site.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a newer push cancel a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history, tags included. The playground shows the module version,
          # which the toolchain derives from the nearest tag. A shallow clone has none,
          # and the page then reports a version from before the last release.
          fetch-depth: 0

      - name: Install Go 1.26.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Formatting, lint rules and import order, none of them auto-fixed here.
      - name: Lint
        run: pnpm exec biome ci .

      # Compiles ./wasm to WebAssembly and runs tsc and vite.
      - name: Build
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
