# A nesting attack: syntactically valid GraphQL that no schema accepts, nested as
# deeply as a parser can be made to nest.
#
# Nothing grows with the nesting but a selection set depth counter, a list type
# depth counter and one byte per open ListValue or InputObjectValue on the value
# stack.
#
# nesting-attack.min.graphql is the same document minified and hashes alike.
#
# Why it's not in the schema-validated benchmark set: a hash-based firewall
# rejects a document like this before schema validation sees it.
