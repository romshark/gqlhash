# A nesting attack: syntactically valid GraphQL that no schema would accept,
# shaped to make a parser recurse as deeply as it can be made to.
#
# gqlhash reads it with one flat state machine, so the only state that grows with
# the nesting is a selection set depth counter, a list type depth counter and one
# byte per open ListValue or InputObjectValue on the preallocated value stack -
# never a Go stack frame.
#
# nesting-attack.min.graphql is the same document minified: it must hash alike.

