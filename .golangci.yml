# Runs in CI (.github/workflows/golangci-lint.yml) and from `make lint`.
version: "2"

# These pass clean as they stand. A linter that would need code changed to go
# green doesn't belong here until the code is changed.
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - durationcheck
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - iface
    - intrange
    - makezero
    - mirror
    - misspell
    - nilerr
    - nilnesserr
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign

# `run` reports unformatted source as a finding; `make fmt` rewrites it.
formatters:
  enable:
    - gofumpt

issues:
  # Every gofumpt finding reads the same, and the default keeps three of a kind,
  # so without this a run names three files and hides the rest.
  max-same-issues: 0
