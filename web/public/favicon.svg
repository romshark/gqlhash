<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Rhodamine on either tab strip. The brand guidelines publish one color and
    no dark variant — the logo appears in Rhodamine, white or black — so the
    glyph doesn't wear the lighter tint the page's interface accent uses in
    dark mode. Drawn as strokes rather than a "#" character so it rasterizes
    identically everywhere, with no font to substitute.
  -->
  <style>
    .glyph {
      stroke: #e10098;
    }
  </style>
  <path
    class="glyph"
    d="M11 25H53M11 41H53M27 8L21 56M45 8L39 56"
    fill="none"
    stroke-width="7"
    stroke-linecap="round"
  />
</svg>
